name: Build iOS IPA (Xcode Compile)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid || true

      - name: Build XPF Library Dependency
        run: |
          cd darksword-kexploit-fun/XPF
          make output/ios/libxpf.dylib output/macos/libxpf.dylib || true

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project darksword-kexploit-fun.xcodeproj \
            -target "darksword-kexploit-fun" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT=build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Compiled .app bundle not found in build directory!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r excalibur-main-v2.ipa Payload

      - name: Create GitHub Release & Upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 excalibur-main-v2.ipa --title "Excalibur Main V2 IPA Build" --notes "Automated Xcode iOS build" --clobber || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: excalibur-main-v2-ipa
          path: excalibur-main-v2.ipa

