name: Build iOS Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          xcodebuild -project darksword-kexploit-fun.xcodeproj \
                     -scheme darksword-kexploit-fun \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     clean build

      - name: Package App into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r darksword-kexploit-fun.ipa Payload

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: darksword-kexploit-fun-ipa
          path: build/darksword-kexploit-fun.ipa
